# Anime (Task 9, docs/results/2026-11-07-identity-profiles.md). Tuned on Fairy Tail E12-E13
# (ja and en dub); held out E14. Best measured setting: WeSpeaker, the shipped pyannote
# diarization, and the joint matcher with episode_cannot_link on at 0.6 (12 clean characters
# of 19 recurring, 2 merges, against centroid's 10 and 2).
# It fails the 90% held-out bar on Fairy Tail E14: fraction 0.55 on ja, 0.60 on the dub.
#
# Joint resolves a whole season at once, so the characters stage cannot run it (that stage
# keeps centroid). `fukikae registry resolve <workspace> --episodes ...` reads [resolve] below.
[registry]
min_new_seconds = 20.0
match_threshold = 0.6

[separation]
backend = "demucs"   # Ruling R15: the dialogue backend stays opt-in

[diarize]
backend = "pyannote"

[embed]
backend = "wespeaker"

[tag]   # character-cards Task 3: event spans and per-turn emotion, SenseVoiceSmall on the CPU
backend = "sensevoice"
enabled = true

[characters]
matcher = "centroid"   # the per-episode stage; joint runs through [resolve]

[resolve]   # `fukikae registry resolve` (Ruling R17); CLI flags override
matcher = "joint"
threshold = 0.6
episode_cannot_link = true
