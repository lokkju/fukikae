# Anime (Task 9, docs/results/2026-11-07-identity-profiles.md). Tuned on Fairy Tail E12-E13
# (ja and en dub); held out E14. Best measured setting: WeSpeaker, the shipped pyannote
# diarization, and the joint matcher with episode_cannot_link on at 0.6 (12 clean characters
# of 19 recurring, 2 merges, against centroid's 10 and 2).
# It fails the 90% held-out bar on Fairy Tail E14: fraction 0.55 on ja, 0.60 on the dub.
#
# Joint resolves a whole season at once, so the characters stage cannot run it (that stage
# keeps centroid). `fukikae registry resolve <workspace> --episodes ...` reads [resolve] below.
[registry]
min_new_seconds = 20.0
match_threshold = 0.6

[separation]
backend = "demucs"   # Ruling R15: the dialogue backend stays opt-in

[diarize]
backend = "pyannote"

[embed]
backend = "wespeaker"

[tag]   # character-cards Tasks 3 and 3b, both on the CPU: SenseVoiceSmall for sound events, emotion2vec+ large for
# the scored per-turn emotion (SenseVoice labels about 9% of turns and gives no score)
backend = "sensevoice"
emotion_backend = "emotion2vec"
enabled = true

[characters]
matcher = "centroid"   # the per-episode stage; joint runs through [resolve]

[resolve]   # `fukikae registry resolve` (Ruling R17); CLI flags override
matcher = "joint"
threshold = 0.6
episode_cannot_link = true

[translate]   # character-cards Task 4: a managed llama-server on gpu_device with Qwen3-8B Q6_K
backend = "openai_compat"
mode = "managed"
model = "Qwen/Qwen3-8B-GGUF"
file = "Qwen3-8B-Q6_K.gguf"
revision = "7c41481f57cb95916b40956ab2f0b139b296d974"
max_speed = 1.25
source = "auto"
subs_condense = true

[tts]   # Kokoro: stock voices (extras, and characters under 6 s of clean speech)
backend = "kokoro"
clone_backend = "indextts2"   # D24: the operator's listening verdict (Task 11)

[tts.gender]   # anime voices sit high: a wide unknown band, and unknowns alternate pools
male_below = 165.0
female_above = 300.0

[timefit]   # character-cards Task 7: rate (tts) and time-stretch share max_speedup; then borrowed silence
max_speedup = 1.25
max_slowdown = 0.9
borrow_silence_ms = 400

[mix]   # character-cards Task 7: original vocals kept outside dub cues; songs (detector, subtitles, tags) untouched
keep_original_vocals = true
fade_ms = 40
match_dialogue = true
protect_bgm = false   # SenseVoice marks BGM under ordinary dialogue (Task 3 review)
detect_songs = true

[tts.indextts2]   # D26: TF32 for the diffusion decoder, 12% faster a line and inside the eval gate
tf32 = true
