# Live action (ground-truth plan, Task 8, 2026-11-09; docs/results/2026-11-09-live-action-ground-truth.md).
# Tuned on seven gate sets, tuning episodes only: The Big Bang Theory S01E01-E02 in English,
# German and Spanish (one show counted three times), Bazinga's TBBT and The Office S01E01-E03
# (PAL audio), Kaze, Kaoru S01E01-E03 (Japanese) and Grid E02 + E04 (Korean).
#
# Pyannote's clustering_threshold drops from community-1's 0.6 to 0.5: at 0.6 one diarized
# speaker held 93-97% of both Leonard and Sheldon on the Spanish and German dubs; from 0.5 the
# Spanish leads split. The German leads stay merged at every value swept (0.6, 0.5, 0.4).
# At 0.5, centroid at 0.6 sums to 17 clean characters with 1 merge (mean fraction 0.714) over
# the gate sets, against 16 and 4 for the old provisional setting (0.6, joint without
# episode_cannot_link). Joint with episode_cannot_link on ties with centroid at 0.50-0.60;
# the simpler matcher wins the tie, and 0.6 is the top of the plateau.
# 0.4 sums to 18 / 1 / 0.857, one character more, all of it りん on Kaze crossing 80%
# (0.79 -> 0.84) on the thinnest set; 0.4 is outside VBx's tuning range (0.5-0.8), so the
# controller treats it as a tie and picks 0.5 (Ruling GT12).
# Held out once after this pick: passes BBT S01E03 en and es (4/4) and Bazinga Office S01E05;
# fails BBT S01E03 de (0.80, Leonard + Sheldon merged), Bazinga TBBT S01E05 (0.67) and Grid E05
# (0.80, no merge) and Kaze, Kaoru E11 (0.50, りん + 直美 merged).
[registry]
min_new_seconds = 20.0
match_threshold = 0.6

[separation]
backend = "demucs"   # Ruling R15: the dialogue backend stays opt-in

[diarize]
backend = "pyannote"
clustering_threshold = 0.5   # community-1 ships 0.6; changing it re-runs diarize (cache key)

[embed]
backend = "wespeaker"

[tag]   # character-cards Tasks 3 and 3b: SenseVoiceSmall for sound events, emotion2vec+ large for the
# scored per-turn emotion (SenseVoice labels about 9% of turns and gives no score); both on the
# GPU under the GPU lock since D26 (the CPU when there is no usable GPU; `device = "cpu"` forces it)
backend = "sensevoice"
emotion_backend = "emotion2vec"
enabled = true

[characters]
matcher = "centroid"   # the pick: the per-episode stage at [registry] match_threshold

[resolve]   # `fukikae registry resolve` (Ruling R17); the joint cell that tied with centroid
matcher = "joint"
threshold = 0.6
episode_cannot_link = true

[translate]   # character-cards Task 4: a managed llama-server on gpu_device with Qwen3-8B Q6_K
backend = "openai_compat"
mode = "managed"
model = "Qwen/Qwen3-8B-GGUF"
file = "Qwen3-8B-Q6_K.gguf"
revision = "7c41481f57cb95916b40956ab2f0b139b296d974"
max_speed = 1.25
source = "auto"
subs_condense = true

[tts]   # every voice is a clone of the speaker's own speech (D41: no stock voices)
clone_backend = "indextts2"   # D24: the operator's listening verdict (Task 11)

[timefit]   # character-cards Task 7: rate (tts) and time-stretch share max_speedup; then borrowed silence
max_speedup = 1.25
max_slowdown = 0.9
borrow_silence_ms = 400

[mix]   # character-cards Task 7: original vocals kept outside dub cues; songs (detector, subtitles, tags) untouched
keep_original_vocals = true
fade_ms = 40
match_dialogue = true
protect_bgm = false   # SenseVoice marks BGM under ordinary dialogue (Task 3 review)
detect_songs = true

[tts.indextts2]   # D26: TF32 for the diffusion decoder, 12% faster a line and inside the eval gate
tf32 = true
