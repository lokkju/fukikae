# The CosyVoice 3 worker environment. A uv project of its own (ruling CD13): CosyVoice pins
# Python 3.10, torch 2.3.1, transformers 4.51.3 and numpy 1.26, which fukikae's environment
# can't hold. CosyVoice and Matcha-TTS ship no package, so their code is not a dependency here:
# `fukikae backends setup cosyvoice3` fetches both at pinned commits into the venv and checks
# their content digest (impl_cosyvoice3.CODE), and the worker checks it again at every load.
# These are the inference subset of CosyVoice's requirements.txt at that commit, at its pins;
# onnxruntime is the CPU build (the speech tokenizer and CAM++ run once per card prompt).
# wetext is left out on purpose: its Normalizer downloads its grammars from ModelScope, unpinned,
# every time it starts (pengzhendong/wetext, rebuilt since wetext 0.0.4), so CosyVoice runs
# without a text normalizer and spells out English numbers with inflect, as it does without one.
[project]
name = "fukikae-worker-cosyvoice3"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.3.1",
    "torchaudio==2.3.1",
    "transformers==4.51.3",
    "numpy==1.26.4",
    "onnxruntime==1.18.0",
    "openai-whisper==20231117",
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "hydra-core==1.3.2",
    "HyperPyYAML==1.2.3",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "modelscope==1.20.0",
    "omegaconf==2.3.0",
    "rich==13.7.1",
    "soundfile==0.12.1",
    "x-transformers==2.11.24",
    # imported at module level on the inference path: by matcha.utils and matcha.hifigan, and
    # by cosyvoice.dataset.processor, which the model config names
    "gdown==5.1.0",
    "wget==3.2",
    "matplotlib==3.7.5",
    "pyarrow==18.1.0",
    "pyworld==0.3.4",
    "huggingface_hub>=0.30,<1",
    "setuptools<81",
]

[tool.uv]
package = false
# openai-whisper's setup.py imports pkg_resources, which setuptools 81 dropped
build-constraint-dependencies = ["setuptools<81"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
