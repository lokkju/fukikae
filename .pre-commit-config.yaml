# Pre-commit hooks configuration
# Install: uv run pre-commit install --install-hooks
# Install commit-msg hook: uv run pre-commit install --hook-type commit-msg
# Run manually: uv run pre-commit run --all-files

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: debug-statements
      - id: name-tests-test
        args: ["--pytest-test-first"]

  # Gitleaks for secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Ruff for linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]

  # Pyright for type checking. It runs from the project's own environment (`uv run`), so it
  # uses the pyright pinned in uv.lock and sees every dependency and backend extra the code
  # imports; an isolated hook environment would need torch and the other extras installed.
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run --frozen pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false

  # Pydoclint for docstring linting (Google style)
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.10.1
    hooks:
      - id: pydoclint
        args:
          - --style=google
          - --check-return-types=False
          - --arg-type-hints-in-docstring=False
          - --check-class-attributes=False
          - --skip-checking-short-docstrings=True
          - --allow-init-docstring=True
        exclude: ^tests/

  # Commitizen for commit message linting (Conventional Commits)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Actionlint for GitHub Actions workflow linting (if using GitHub Actions)
  # - repo: https://github.com/rhysd/actionlint
  #   rev: v1.7.12
  #   hooks:
  #     - id: actionlint

  # UV for dependency management - ensures uv.lock is synced
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.21
    hooks:
      - id: uv-lock
